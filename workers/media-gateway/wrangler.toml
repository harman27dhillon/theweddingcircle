name = "wedding-circle-media-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-01"
workers_dev = false
preview_urls = false
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://theweddingcircle.in,https://www.theweddingcircle.in"
MEDIA_EDGE_CACHE = "authorized"

# This file does not deploy, change DNS, or make a bucket public.
# bucket_name MUST be the existing private bucket (the same name as R2_BUCKET).
# Do not add a public r2.dev domain. Do not add a public R2 custom domain.
# Point media.theweddingcircle.in at this Worker from the Cloudflare dashboard.

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wedding-circle-media"

# Secret, set in the dashboard or with: wrangler secret put MEDIA_GATEWAY_SECRET
# Never commit the value. The app server needs the same secret as MEDIA_GATEWAY_SECRET.
#
# [vars]
# ALLOWED_ORIGINS = "https://theweddingcircle.in,https://www.theweddingcircle.in"

[observability.logs]
enabled = true

[observability.issues]
enabled = false
